<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ElevenLabs Screenplay Formatter (Python)</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='candlelight.css') }}"
    />
    <script
      src="{{ url_for('static', filename='htmx.min.js') }}"
      onerror="
        this.onerror = null;
        this.src = 'https://unpkg.com/htmx.org@1.9.12';
      "
      defer
    ></script>
  </head>

  <body>
    <header class="site-header">
      <div class="container">
        <h1>ElevenLabs Screenplay Formatter</h1>
        <p class="subtitle">Python modular monolith (Flask + HTMX + FastAPI)</p>
        <nav class="nav">
          <a class="nav-link" href="/" {% if request.path == "/" %}aria-current="page"{% endif %}>Script</a>
          <a class="nav-link" href="/characters" {% if request.path.startswith("/characters") %}aria-current="page"{% endif %}>Characters</a>
          <a class="nav-link" href="/generation" {% if request.path.startswith("/generation") %}aria-current="page"{% endif %}>Generation</a>
          <a class="nav-link" href="/timeline" {% if request.path.startswith("/timeline") %}aria-current="page"{% endif %}>Timeline</a>
          <a class="nav-link" href="/exports" {% if request.path.startswith("/exports") %}aria-current="page"{% endif %}>Exports</a>
          <form action="/reset" method="post" style="margin: 0; display: flex">
            <button
              class="nav-link"
              type="submit"
            >
              New Play
            </button>
          </form>
        </nav>
      </div>
    </header>
    <main class="container">{% block content %} {% endblock %}</main>
    <script>
      (function () {
        function bindJobPanels(root) {
          const selector = "[data-sse-url]:not([data-sse-bound])";

          function bindOne(panel) {
            panel.setAttribute("data-sse-bound", "1");
            const url = panel.getAttribute("data-sse-url");
            if (!url) return;

            const statusEl = panel.querySelector('[data-role="job-status"]');
            const messageEl = panel.querySelector('[data-role="job-message"]');
            const progressEl = panel.querySelector(
              '[data-role="job-progress"]',
            );
            const exportEl = panel.querySelector('[data-role="job-export"]');
            let jobState = statusEl ? statusEl.textContent || "" : "";

            const es = new EventSource(url);

            es.onmessage = function () {};

            function setExportReady(jobId, opts) {
              opts = opts || {};
              if (!exportEl) return;
              let html =
                '<a class="btn" href="/api/exports/' +
                jobId +
                '.zip">Download ZIP</a>';

              html +=
                '<a class="btn secondary" href="/api/exports/' +
                jobId +
                '.json">manifest.json</a>' +
                '<a class="btn secondary" href="/api/exports/' +
                jobId +
                '.csv">manifest.csv</a>' +
                '<a class="btn secondary" href="/api/exports/' +
                jobId +
                '.srt">SRT</a>' +
                '<a class="btn secondary" href="/api/exports/' +
                jobId +
                '.vtt">VTT</a>' +
                '<a class="btn secondary" href="/api/exports/' +
                jobId +
                '.rpp">Reaper (.rpp)</a>' +
                '<a class="btn secondary" href="/timeline?job_id=' +
                jobId +
                '">Timeline</a>';
              exportEl.innerHTML = html;
            }

            function clearExport() {
              if (exportEl) exportEl.innerHTML = "";
            }

            function syncJobControls(status) {
              const controlsEl = panel.querySelector('[data-role="job-controls"]');
              if (!controlsEl) return;

              const stopButton = controlsEl.querySelector('[data-role="job-stop"]');
              const stopNote = controlsEl.querySelector('[data-role="job-stop-note"]');

              if (status === "cancelling") {
                if (stopButton) {
                  stopButton.textContent = "Stopping...";
                  stopButton.setAttribute("disabled", "disabled");
                  stopButton.setAttribute("aria-disabled", "true");
                  stopButton.setAttribute("aria-busy", "true");
                  stopButton.classList.add("is-busy");
                }
                if (stopNote) {
                  stopNote.textContent =
                    "Waiting for the current clip to finish, then generation will stop.";
                }
                return;
              }

              if (status === "complete" || status === "error" || status === "cancelled") {
                controlsEl.innerHTML = "";
                return;
              }

              if (stopButton) {
                stopButton.textContent = "Stop Job";
                stopButton.removeAttribute("disabled");
                stopButton.removeAttribute("aria-disabled");
                stopButton.removeAttribute("aria-busy");
                stopButton.classList.remove("is-busy");
              }
            }

            function renderStatus(text) {
              if (!statusEl) return;
              statusEl.textContent = text || "";
              statusEl.className =
                "status status--" + (text || "").toLowerCase();
            }

            function setJobState(text) {
              jobState = text || "";
              renderStatus(jobState);
              syncJobControls(jobState);
            }

            es.addEventListener("snapshot", function (ev) {
              try {
                const snap = JSON.parse(ev.data || "{}");
                setJobState(snap.status || "");
                if (messageEl) messageEl.textContent = snap.message || "";
                if (progressEl) {
                  const cur = snap.current || 0;
                  const total = snap.total || 0;
                  progressEl.textContent = total
                    ? cur + " / " + total
                    : String(cur);
                }
                if (snap.export_ready) setExportReady(snap.job_id);
              } catch (_) {}
            });

            es.addEventListener("status", function (ev) {
              try {
                const d = JSON.parse(ev.data || "{}");
                if (d.status) setJobState(d.status);
                if (messageEl && d.message) messageEl.textContent = d.message;
                if (progressEl && (d.current !== undefined || d.total !== undefined)) {
                  const cur = d.current || 0;
                  const total = d.total || 0;
                  progressEl.textContent = total
                    ? cur + " / " + total
                    : String(cur);
                }
              } catch (_) {}
            });

            es.addEventListener("warning", function (ev) {
              try {
                const d = JSON.parse(ev.data || "{}");
                const details = d.details || d.warning || "Warning";
                if (messageEl) messageEl.textContent = String(details);
              } catch (_) {}
            });

            es.addEventListener("progress", function (ev) {
              try {
                const d = JSON.parse(ev.data || "{}");
                const transientStatus =
                  jobState === "cancelling" || jobState === "cancelled"
                    ? jobState
                    : d.status || "running";
                renderStatus(transientStatus);
                if (messageEl) messageEl.textContent = d.message || "";
                if (progressEl)
                  progressEl.textContent =
                    (d.current || 0) + " / " + (d.total || 0);
              } catch (_) {}
            });

            es.addEventListener("complete", function (ev) {
              setJobState("complete");
              try {
                const d = JSON.parse(ev.data || "{}");
                if (messageEl && d.message) messageEl.textContent = d.message;
                const jobId = panel.getAttribute("data-job-id");
                if (jobId && d.export_ready) setExportReady(jobId);
              } catch (_) {}
            });

            es.addEventListener("job_error", function (ev) {
              setJobState("error");
              clearExport();
              if (messageEl) {
                try {
                  const d = JSON.parse(ev.data || "{}");
                  messageEl.textContent = d.error || "Error";
                } catch (_) {
                  messageEl.textContent = ev.data || "Error";
                }
              }
            });

            es.addEventListener("cancelled", function (ev) {
              setJobState("cancelled");
              clearExport();
              if (messageEl) {
                try {
                  const d = JSON.parse(ev.data || "{}");
                  messageEl.textContent = d.message || "Stopped";
                } catch (_) {
                  messageEl.textContent = "Stopped";
                }
              }
            });

            es.addEventListener("done", function (ev) {
              try {
                const d = JSON.parse(ev.data || "{}");
                if (d.status) setJobState(d.status);
                if (messageEl && d.message) messageEl.textContent = d.message;
                const jobId = panel.getAttribute("data-job-id");
                if (jobId && d.export_ready) setExportReady(jobId);
              } catch (_) {}
              es.close();
            });

            es.onopen = function () {};
            es.onerror = function () {
              if (statusEl && statusEl.textContent !== "complete")
                renderStatus("disconnected");
            };
          }

          if (root.matches && root.matches(selector)) {
            bindOne(root);
          }
          root.querySelectorAll(selector).forEach(bindOne);
        }

        const observer = new MutationObserver((mutations) => {
          for (const m of mutations) {
            for (const n of m.addedNodes) {
              if (n && n.nodeType === 1) bindJobPanels(n);
            }
          }
        });
        observer.observe(document.documentElement, {
          childList: true,
          subtree: true,
        });
        bindJobPanels(document);
      })();
    </script>
    <script>
      (function () {
        const transientPressMs = 180;
        const pendingControls = new WeakMap();

        function isButtonLike(control) {
          return !!(
            control &&
            control.classList &&
            control.classList.contains("btn")
          );
        }

        function resolveControl(source) {
          if (!source || !source.closest) return null;
          if (isButtonLike(source)) return source;
          if (source.tagName === "FORM") {
            return pendingControls.get(source) || null;
          }
          return source.closest(".btn");
        }

        function setPressed(control) {
          if (!isButtonLike(control)) return;
          control.classList.remove("is-pressed");
          window.requestAnimationFrame(function () {
            control.classList.add("is-pressed");
            window.setTimeout(function () {
              control.classList.remove("is-pressed");
            }, transientPressMs);
          });
        }

        function setBusy(control, busy) {
          if (!isButtonLike(control)) return;
          if (busy) {
            if (!control.hasAttribute("aria-busy")) {
              control.style.width = control.offsetWidth + "px";
            }
            control.classList.add("is-busy");
            control.setAttribute("aria-busy", "true");
          } else {
            control.classList.remove("is-busy");
            control.removeAttribute("aria-busy");
            control.style.removeProperty("width");
          }
        }

        document.addEventListener(
          "click",
          function (event) {
            const control = event.target.closest(".btn");
            if (!isButtonLike(control)) return;
            setPressed(control);
            if (control.form) {
              pendingControls.set(control.form, control);
            }
          },
          true,
        );

        document.addEventListener(
          "submit",
          function (event) {
            if (!isButtonLike(event.submitter)) return;
            pendingControls.set(event.target, event.submitter);
            setBusy(event.submitter, true);
          },
          true,
        );

        function clearBusy(source) {
          const control = resolveControl(source);
          setBusy(control, false);
          if (source) {
            pendingControls.delete(source);
          }
        }

        document.body.addEventListener("htmx:beforeRequest", function (event) {
          const source = event.detail && event.detail.elt;
          const control = resolveControl(source);
          if (!control) return;
          if (source) {
            pendingControls.set(source, control);
          }
          setBusy(control, true);
        });

        ["htmx:afterRequest", "htmx:responseError", "htmx:sendError"].forEach(
          function (eventName) {
            document.body.addEventListener(eventName, function (event) {
              clearBusy(event.detail && event.detail.elt);
            });
          },
        );
      })();
    </script>
  </body>
</html>
