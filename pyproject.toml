[project]
name = "elevenlabs-screenplay-formatter"
version = "1.0.0-dev"
description = "Python modular monolith rewrite of ElevenLabs Screenplay Formatter"
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
  "fastapi>=0.110",
  "flask>=3.0",
  "jinja2>=3.1",
  "pydantic>=2.6",
  "python-multipart>=0.0.9",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "ruff>=0.6",
  "mypy>=1.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.9"
strict = true
warn_unreachable = true
disallow_any_generics = true
no_implicit_optional = true
show_error_codes = true

